<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMA transfer</title>
<style>:root{color-scheme:light;--bg:#fff;--soft:#f6f7f9;--sunk:#eef0f3;--fg:#1c2330;--muted:#5f6b7a;--line:#dde1e7;--accent:#2563eb;--accent-soft:#e8efff;--on-accent:#fff;
--rom:#b45309;--romf:#fef3c7;--flash:#6d28d9;--flashf:#ede9fe;--ram:#15803d;--ramf:#d1fae5;--bus:#0e7490;--busf:#cffafe;--bad:#c62828;--badf:#fde8e8;--ok:#15803d;--okf:#dcfce7;--warn:#b45309;--warnf:#fef9c3;--r:10px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f141b;--soft:#161c25;--sunk:#1d2531;--fg:#e4e8ee;--muted:#98a3b3;--line:#2a3441;--accent:#6ea0ff;--accent-soft:#1b2a45;--on-accent:#0b1220;--rom:#fbbf24;--romf:#3a2d0e;--flash:#a78bfa;--flashf:#2a2150;--ram:#4ade80;--ramf:#0f3328;--bus:#22d3ee;--busf:#0c3a44;--bad:#f87171;--badf:#3b1818;--ok:#4ade80;--okf:#12331f;--warn:#fbbf24;--warnf:#3a3210}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
.mono,code,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
h1,h2,h3{margin:0 0 6px;line-height:1.25}h1{font-size:1.15rem}h2{font-size:1rem}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){background:var(--sunk)}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=range]{font:inherit;color:inherit}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.panel[hidden]{display:none}
.card{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.grow{flex:1}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.narr{min-height:3.4em;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.regs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.reg{border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--soft);min-width:120px}
.reg b{display:block;font-size:.75rem;color:var(--muted);font-weight:600}.reg span{font-family:ui-monospace,monospace;font-size:1.05rem}
.reg.on{border-color:var(--accent);background:var(--accent-soft)}.reg.flag.on{border-color:var(--ok);background:var(--okf)}
.mem{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:4px 0 10px}
.cell{border:1px solid var(--line);border-radius:6px;padding:6px 0;text-align:center;font-family:ui-monospace,monospace;font-size:.85rem;background:var(--soft);min-width:0}
.cell small{display:block;color:var(--muted);font-size:.62rem}.cell.cur{outline:3px solid var(--accent)}.cell.done{background:var(--okf)}

</style></head><body>
<h1>Anatomy of one DMA transfer</h1>
<div class="bar"><label>Direction <select id="dir"><option value="mm">Memory → memory (both addresses increment)</option><option value="pm">Peripheral → memory (source address fixed)</option></select></label></div>
<h2 id="st">Source</h2><div class="mem" id="src"></div>
<h2>Destination (memory)</h2><div class="mem" id="dst"></div>
<div class="regs" id="regs"></div>
<div class="narr" id="narr" aria-live="polite"></div>
<div class="bar" style="margin-top:10px"><button id="prev">◀ Back</button><button id="play" class="primary">▶ Play</button><button id="next">Next ▶</button><button id="reset">↺</button><span class="muted" id="count"></span></div>
<script>const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex=(n,w=8)=>'0x'+(n>>>0).toString(16).toUpperCase().padStart(w,'0');
// tabs: buttons with data-tab="id" show the .panel with that id
function initTabs(start=window.__START||0){const btns=$$('.tabs button');const show=id=>{btns.forEach(b=>{const on=b.dataset.tab===id;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});$$('.panel').forEach(p=>p.hidden=p.id!==id)};btns.forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));if(btns[start])show(btns[start].dataset.tab);return show}
// player: generic step controller. steps = count; render(i) draws step i; returns controls
function player({count,render,prev,next,play,reset,delay=1800}){let i=0,timer=null;const set=n=>{i=Math.max(0,Math.min(count-1,n));render(i);if(prev)prev.disabled=i===0;if(next)next.disabled=i===count-1;};const stop=()=>{clearInterval(timer);timer=null;if(play)play.textContent='▶ Play'};const go=()=>{if(i>=count-1){stop();return}set(i+1)};
if(next)next.onclick=()=>{stop();set(i+1)};if(prev)prev.onclick=()=>{stop();set(i-1)};if(reset)reset.onclick=()=>{stop();set(0)};
if(play)play.onclick=()=>{if(timer){stop();return}if(i>=count-1)set(0);play.textContent='❚❚ Pause';timer=setInterval(go,delay)};
addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if(e.key==='ArrowRight'){stop();set(i+1)}if(e.key==='ArrowLeft'){stop();set(i-1)}});
set(0);return{set,stop,get i(){return i}}}


const N=8,SRC0=0x20000000,DST0=0x20000100,PER=0x40012400;let P;
const data=[11,22,33,44,55,66,77,88];
const hx=v=>'0x'+v.toString(16).toUpperCase().padStart(8,'0');
function render(i){const pm=$('#dir').value==='pm';// step 0 = configured, step k (1..8) = k words moved, step 9 = interrupt serviced
 const done=Math.min(Math.max(i-1,0),N),enabled=i>=1;const remaining=N-done;
 $('#st').textContent=pm?'Source: a peripheral data register (e.g. ADC result), the address never changes':'Source (memory)';
 $('#src').innerHTML=Array.from({length:N},(_,k)=>pm?(k===0?`<div class="cell ${enabled&&done<N?'cur':''}">DR<small>${hx(PER)}</small></div>`:`<div class="cell" style="opacity:.25">–</div>`):`<div class="cell ${k===done&&enabled&&done<N?'cur':''} ${k<done?'done':''}">${data[k]}<small>+${k*4}</small></div>`).join('');
 $('#dst').innerHTML=Array.from({length:N},(_,k)=>`<div class="cell ${k===done&&enabled&&done<N?'cur':''} ${k<done?'done':''}">${k<done?data[k]:'?'}<small>+${k*4}</small></div>`).join('');
 const sa=pm?PER:SRC0+4*done,da=DST0+4*done,ht=done>=N/2,tc=done>=N;
 const R=(n,v,on)=>`<div class="reg ${on?'on':''}"><b>${n}</b><span>${v}</span></div>`;
 $('#regs').innerHTML=R('SOURCE address',hx(sa),enabled&&done<N)+R('DEST address',hx(da),enabled&&done<N)+R('COUNT remaining',remaining,enabled&&done<N)+R('data width','32 bit',false)+`<div class="reg flag ${ht?'on':''}"><b>half-transfer flag</b><span>${ht?'1':'0'}</span></div><div class="reg flag ${tc?'on':''}"><b>transfer-complete flag</b><span>${tc?'1':'0'}</span></div>`;
 const say=[`Configuration (the CPU writes these once): source address, destination address, number of items (${N}), data width, and whether each address increments. ${pm?'For a peripheral source the address is NOT incremented, because every read of the data register returns the next sample. ':'In memory-to-memory mode both addresses increment. '}Nothing moves yet.`,
  ...Array.from({length:N},(_,k)=>`Transfer ${k+1} of ${N}: DMA reads ${pm?'the peripheral register (value '+data[k]+')':'the source word '+data[k]} and writes it to the destination, then ${pm?'increments only the destination address':'increments both addresses'} and decrements COUNT to ${N-k-1}.`+(k===N/2-1?' Half of the items are done: the half-transfer flag is set (an interrupt can fire if enabled).':'')),
  `COUNT reached 0: the transfer-complete flag is set and the interrupt handler runs. The CPU never copied a word. ${'In circular mode DMA would now reload the addresses and COUNT and start over.'}`];
 $('#narr').textContent=say[i];$('#count').textContent=`Step ${i+1} of ${N+2}`}
P=player({count:N+2,prev:$('#prev'),next:$('#next'),play:$('#play'),reset:$('#reset'),render,delay:1200});$('#dir').onchange=()=>render(P.i);

</script></body></html>
