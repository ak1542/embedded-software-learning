<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cortex-M4: 3-stage pipeline and core features</title>
<style>
:root{color-scheme:light;--bg:#fff;--soft:#f6f7f9;--sunk:#eef0f3;--fg:#1c2330;--muted:#5f6b7a;--line:#dde1e7;--accent:#2563eb;--accent-soft:#e8efff;--on-accent:#fff;
--rom:#b45309;--romf:#fef3c7;--flash:#6d28d9;--flashf:#ede9fe;--ram:#15803d;--ramf:#d1fae5;--bus:#0e7490;--busf:#cffafe;--bad:#c62828;--badf:#fde8e8;--ok:#15803d;--okf:#dcfce7;--warn:#b45309;--warnf:#fef9c3;--r:10px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f141b;--soft:#161c25;--sunk:#1d2531;--fg:#e4e8ee;--muted:#98a3b3;--line:#2a3441;--accent:#6ea0ff;--accent-soft:#1b2a45;--on-accent:#0b1220;--rom:#fbbf24;--romf:#3a2d0e;--flash:#a78bfa;--flashf:#2a2150;--ram:#4ade80;--ramf:#0f3328;--bus:#22d3ee;--busf:#0c3a44;--bad:#f87171;--badf:#3b1818;--ok:#4ade80;--okf:#12331f;--warn:#fbbf24;--warnf:#3a3210}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
.mono,code,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
h1,h2,h3{margin:0 0 6px;line-height:1.25}h1{font-size:1.15rem}h2{font-size:1rem}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){background:var(--sunk)}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=range]{font:inherit;color:inherit}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.panel[hidden]{display:none}
.card{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.grow{flex:1}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.narr{min-height:3.4em;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 12px}
.stage{border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);min-height:74px;transition:border-color .3s,background .3s}
.stage h3{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px}
.stage .ins{font:600 .95rem ui-monospace,Menlo,Consolas,monospace;transition:transform .35s,opacity .35s}
.stage.F.busy{border-color:#2563eb;background:color-mix(in srgb,#2563eb 12%,var(--bg))}
.stage.D.busy{border-color:#9333ea;background:color-mix(in srgb,#9333ea 12%,var(--bg))}
.stage.E.busy{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.stage.flush{border-color:var(--bad);background:var(--badf)}
.stage small{display:block;color:var(--muted);margin-top:2px;font-size:.78rem}
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
table.g{border-collapse:collapse;width:100%;font:12px ui-monospace,Menlo,Consolas,monospace}
table.g th,table.g td{border:1px solid var(--line);padding:3px 0;text-align:center;min-width:30px}
table.g th.i,table.g td.i{text-align:left;padding:3px 8px;min-width:130px;position:sticky;left:0;background:var(--soft);z-index:1}
td.F{background:#2563eb;color:#fff}td.D{background:#9333ea;color:#fff}td.E{background:var(--ok);color:var(--on-accent)}td.X{background:var(--bad);color:#fff}
td.hid{background:transparent!important;color:transparent!important}
th.now,td.now:not(.F):not(.D):not(.E):not(.X){background:var(--accent-soft)}
th.now{border-bottom:3px solid var(--accent)}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:.82rem}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.feat{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.feat button{border-radius:999px;font-size:.82rem;padding:3px 11px}
</style></head>
<body>
<h1>Cortex-M4: 3-stage pipeline</h1>
<div class="bar" style="margin-bottom:8px">
  <label>Program <select id="scn"><option value="a">Straight-line code</option><option value="b">Taken branch (pipeline flush)</option><option value="c">Hardware divide (multi-cycle)</option></select></label>
  <label id="divLbl" hidden>UDIV takes <input type="range" id="lat" min="2" max="12" value="5"> <b id="latV">5</b> cycles</label>
</div>
<div class="stages" aria-live="polite">
  <div class="stage F" id="sF"><h3>1 · Fetch</h3><div class="ins" id="iF">–</div></div>
  <div class="stage D" id="sD"><h3>2 · Decode</h3><div class="ins" id="iD">–</div></div>
  <div class="stage E" id="sE"><h3>3 · Execute</h3><div class="ins" id="iE">–</div></div>
</div>
<div class="gantt"><table class="g" id="g"></table></div>
<p class="legend"><span><i style="background:#2563eb"></i>Fetch</span><span><i style="background:#9333ea"></i>Decode</span><span><i style="background:var(--ok)"></i>Execute</span><span><i style="background:var(--bad)"></i>Flushed (wasted)</span></p>
<div class="narr" id="narr" aria-live="polite"></div>
<div class="bar" style="margin-top:10px"><button id="prev">◀ Cycle</button><button class="primary" id="play">▶ Play</button><button id="next">Cycle ▶</button><button id="reset">↺ Restart</button><span class="grow"></span><b id="cyc"></b></div>
<h2 style="margin-top:16px">Core features: tap one</h2>
<div class="feat" id="feat"></div>
<div class="narr" id="fnarr" style="margin-top:8px">Armv7E-M architecture, Thumb / Thumb-2 instruction set, optional FPU and MPU, NVIC with up to 240 interrupts.</div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex=(n,w=8)=>'0x'+(n>>>0).toString(16).toUpperCase().padStart(w,'0');
// tabs: buttons with data-tab="id" show the .panel with that id
function initTabs(start=window.__START||0){const btns=$$('.tabs button');const show=id=>{btns.forEach(b=>{const on=b.dataset.tab===id;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});$$('.panel').forEach(p=>p.hidden=p.id!==id)};btns.forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));if(btns[start])show(btns[start].dataset.tab);return show}
// player: generic step controller. steps = count; render(i) draws step i; returns controls
function player({count,render,prev,next,play,reset,delay=1800}){let i=0,timer=null;const set=n=>{i=Math.max(0,Math.min(count-1,n));render(i);if(prev)prev.disabled=i===0;if(next)next.disabled=i===count-1;};const stop=()=>{clearInterval(timer);timer=null;if(play)play.textContent='▶ Play'};const go=()=>{if(i>=count-1){stop();return}set(i+1)};
if(next)next.onclick=()=>{stop();set(i+1)};if(prev)prev.onclick=()=>{stop();set(i-1)};if(reset)reset.onclick=()=>{stop();set(0)};
if(play)play.onclick=()=>{if(timer){stop();return}if(i>=count-1)set(0);play.textContent='❚❚ Pause';timer=setInterval(go,delay)};
addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if(e.key==='ArrowRight'){stop();set(i+1)}if(e.key==='ArrowLeft'){stop();set(i-1)}});
set(0);return{set,stop,get i(){return i}}}

const SCN={
 a:{prog:[{n:'ADD r0,r1,r2'},{n:'LDR r3,[r0]'},{n:'MLA r4,r3,r5,r6',note:'single-cycle MAC'},{n:'STR r4,[r7]'},{n:'SUB r1,r1,#1'}],
    note:'Straight-line code: one instruction finishes every cycle once the pipeline is full (after 2 cycles of filling).'},
 b:{prog:[{n:'ADD r0,r0,#1'},{n:'CMP r0,#10'},{n:'BNE loop',branch:true},{n:'(next instr)',wrong:true},{n:'(next instr)',wrong:true},{n:'loop: LDR r1,[r2]'},{n:'ADD r3,r3,r1'}],
    note:'A taken branch is only known in Execute, so the two instructions already fetched behind it are thrown away: a 2-cycle penalty.'},
 c:{prog:[{n:'ADD r0,r1,r2'},{n:'UDIV r3,r4,r5',lat:5},{n:'ADD r6,r6,#1'},{n:'STR r3,[r7]'}],
    note:'UDIV stays in Execute for several cycles (hardware divide takes 2–12 cycles), so the instructions behind it wait in Fetch and Decode.'}
};
function simulate(prog){
 const n=prog.length,cells=prog.map(()=>({})),occ=[];let F=0,D=null,E=null,rem=0,fi=1,cycle=0;
 while(cycle<60&&(F!==null||D!==null||E!==null||fi<n)){cycle++;
  occ.push({F,D,E,x:[]});
  if(F!==null)cells[F][cycle]='F';if(D!==null)cells[D][cycle]='D';if(E!==null)cells[E][cycle]='E';
  // advance
  let flushed=[];
  if(E!==null){rem--;if(rem===0){const ins=prog[E];E=null;
    if(ins.branch){for(const k of [D,F]){if(k!==null){cells[k][cycle]='X';flushed.push(k)}}D=null;F=null;
      fi=prog.findIndex((p,idx)=>idx>prog.indexOf(ins)&&!p.wrong)}}}
  occ[occ.length-1].x=flushed;
  if(E===null&&D!==null){E=D;D=null;rem=prog[E].lat||1}
  if(D===null&&F!==null){D=F;F=null}
  if(F===null&&fi<n&&fi>=0){F=fi++;}
 }
 return{cells,occ,cycles:occ.length};
}
let sim,prog,P;
function build(){
 const key=$('#scn').value;const sc=SCN[key];prog=sc.prog.map(p=>({...p}));
 $('#divLbl').hidden=key!=='c';if(key==='c')prog[1].lat=+$('#lat').value;$('#latV').textContent=$('#lat').value;
 sim=simulate(prog);
 const C=sim.cycles;
 $('#g').innerHTML='<thead><tr><th class="i">Instruction</th>'+Array.from({length:C},(_,i)=>`<th data-c="${i+1}">${i+1}</th>`).join('')+'</tr></thead><tbody>'+
  prog.map((p,i)=>`<tr><td class="i">${esc(p.n)}</td>`+Array.from({length:C},(_,c)=>{const v=sim.cells[i][c+1]||'';return `<td data-c="${c+1}" data-v="${v}" class="${v}">${v}</td>`}).join('')+'</tr>').join('')+'</tbody>';
 if(P)P.stop();
 P=player({count:C,prev:$('#prev'),next:$('#next'),play:$('#play'),reset:$('#reset'),delay:1100,render:show});
 $('#narr').textContent=sc.note;
}
function show(i){
 const c=i+1,o=sim.occ[i];
 $$('#g [data-c]').forEach(e=>{const cc=+e.dataset.c;e.classList.toggle('now',cc===c);if(e.tagName==='TD'){e.classList.toggle('hid',cc>c)}});
 const name=k=>k===null?'–':prog[k].n;
 for(const s of ['F','D','E']){const k=o[s];$('#s'+s).classList.toggle('busy',k!==null);$('#i'+s).textContent=name(k);$('#s'+s).classList.toggle('flush',o.x.length>0&&s!=='E'&&o.x.includes(k))}
 $('#cyc').textContent=`Cycle ${c} of ${sim.cycles}`;
}
$('#scn').onchange=build;$('#lat').oninput=build;build();
const FEAT={
 'Thumb / Thumb-2':'Compact 16/32-bit mixed instruction set. Cortex-M runs Thumb only; there is no Arm (32-bit) state.',
 '3-stage pipeline':'Fetch, Decode, Execute (above). Simple and small, with a short branch penalty.',
 'Single-cycle MAC':'16×16 / 32×32 multiply-accumulate in one cycle, plus dual 16-bit MAC and 8/16-bit SIMD (the DSP extensions).',
 'Hardware divide':'SDIV / UDIV take 2–12 cycles depending on the operands: no software division routine needed.',
 'FPU (optional)':'Single-precision, IEEE 754-compliant floating-point unit.',
 'MPU (optional)':'Up to 8 regions with sub-regions and a background region to protect memory.',
 'Bit-banding':'Bit-field instructions plus bus-level bit banding for atomic single-bit access.',
 'NVIC':'Non-maskable interrupt plus 1 to 240 physical interrupts with 8 to 256 priority levels. Wake-up interrupt controller.',
 'WFI / WFE / sleep':'Wait-for-interrupt/event, sleep-on-exit, Sleep and Deep Sleep signals, optional retention mode.',
 'AHB-lite buses':'3 × AMBA AHB-lite interfaces (Harvard) + AMBA ATB for CoreSight debug.',
 'Debug & trace':'Optional JTAG and Serial Wire ports, up to 8 breakpoints and 4 watchpoints, ETM / DWT / ITM trace.'
};
$('#feat').innerHTML=Object.keys(FEAT).map(k=>`<button>${esc(k)}</button>`).join('');
$$('#feat button').forEach(b=>b.onclick=()=>{$$('#feat button').forEach(x=>x.classList.toggle('on',x===b));$('#fnarr').textContent=b.textContent+': '+FEAT[b.textContent]});
</script></body></html>
