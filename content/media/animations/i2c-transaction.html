<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I2C transaction</title>
<style>:root{color-scheme:light;--bg:#fff;--soft:#f6f7f9;--sunk:#eef0f3;--fg:#1c2330;--muted:#5f6b7a;--line:#dde1e7;--accent:#2563eb;--accent-soft:#e8efff;--on-accent:#fff;
--rom:#b45309;--romf:#fef3c7;--flash:#6d28d9;--flashf:#ede9fe;--ram:#15803d;--ramf:#d1fae5;--bus:#0e7490;--busf:#cffafe;--bad:#c62828;--badf:#fde8e8;--ok:#15803d;--okf:#dcfce7;--warn:#b45309;--warnf:#fef9c3;--r:10px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f141b;--soft:#161c25;--sunk:#1d2531;--fg:#e4e8ee;--muted:#98a3b3;--line:#2a3441;--accent:#6ea0ff;--accent-soft:#1b2a45;--on-accent:#0b1220;--rom:#fbbf24;--romf:#3a2d0e;--flash:#a78bfa;--flashf:#2a2150;--ram:#4ade80;--ramf:#0f3328;--bus:#22d3ee;--busf:#0c3a44;--bad:#f87171;--badf:#3b1818;--ok:#4ade80;--okf:#12331f;--warn:#fbbf24;--warnf:#3a3210}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
.mono,code,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
h1,h2,h3{margin:0 0 6px;line-height:1.25}h1{font-size:1.15rem}h2{font-size:1rem}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){background:var(--sunk)}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=range]{font:inherit;color:inherit}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.panel[hidden]{display:none}
.card{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.grow{flex:1}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.narr{min-height:3.4em;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


svg{width:100%;height:auto;display:block;background:var(--soft);border:1px solid var(--line);border-radius:var(--r)}
.row{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin:6px 0}

</style></head><body>
<h1>I2C transaction: one device, two wires</h1>
<div class="row"><label>Transaction <select id="kind"><option value="w">Write 0x5A to register 0x01 of device 0x48</option><option value="r">Read register 0x01 of device 0x48 (repeated START)</option></select></label></div>
<svg id="svg" viewBox="0 0 960 240" role="img" aria-label="I2C SDA and SCL waveform"></svg>
<div class="narr" id="narr" aria-live="polite"></div>
<div class="bar" style="margin-top:10px"><button id="prev">◀ Back</button><button id="play" class="primary">▶ Play</button><button id="next">Next ▶</button><button id="reset">↺</button><span class="muted" id="count"></span></div>
<script>const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex=(n,w=8)=>'0x'+(n>>>0).toString(16).toUpperCase().padStart(w,'0');
// tabs: buttons with data-tab="id" show the .panel with that id
function initTabs(start=window.__START||0){const btns=$$('.tabs button');const show=id=>{btns.forEach(b=>{const on=b.dataset.tab===id;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});$$('.panel').forEach(p=>p.hidden=p.id!==id)};btns.forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));if(btns[start])show(btns[start].dataset.tab);return show}
// player: generic step controller. steps = count; render(i) draws step i; returns controls
function player({count,render,prev,next,play,reset,delay=1800}){let i=0,timer=null;const set=n=>{i=Math.max(0,Math.min(count-1,n));render(i);if(prev)prev.disabled=i===0;if(next)next.disabled=i===count-1;};const stop=()=>{clearInterval(timer);timer=null;if(play)play.textContent='▶ Play'};const go=()=>{if(i>=count-1){stop();return}set(i+1)};
if(next)next.onclick=()=>{stop();set(i+1)};if(prev)prev.onclick=()=>{stop();set(i-1)};if(reset)reset.onclick=()=>{stop();set(0)};
if(play)play.onclick=()=>{if(timer){stop();return}if(i>=count-1)set(0);play.textContent='❚❚ Pause';timer=setInterval(go,delay)};
addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if(e.key==='ArrowRight'){stop();set(i+1)}if(e.key==='ArrowLeft'){stop();set(i-1)}});
set(0);return{set,stop,get i(){return i}}}


const NS='http://www.w3.org/2000/svg';const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const byte=v=>Array.from({length:8},(_,i)=>(v>>(7-i))&1);
let P,tl;
function make(kind){// groups of events. Each state = {sda,scl,len,own}; groups carry text
 const st=[],groups=[];let t=0;
 const push=(sda,scl,len,own)=>{st.push({sda,scl,t0:t,t1:t+len,own});t+=len};
 const group=(label,say,f)=>{const a=t;f();groups.push({label,say,a,b:t})};
 const bitsOut=(bits,own,ackBit)=>{bits.forEach(b=>{push(b,0,1,own);push(b,1,2,own);push(b,0,1,own)})};
 const ack=(nack)=>{push(nack?1:0,0,1,'s');push(nack?1:0,1,2,'s');push(nack?1:0,0,1,'s')};
 group('Idle','Both lines idle HIGH: the pull-up resistors hold SDA and SCL high because every device lets go of them.',()=>push(1,1,3,'m'));
 group('START','START: the master pulls SDA LOW while SCL is HIGH. This is the only time SDA may change while SCL is high, so every device on the bus notices it.',()=>{push(0,1,2,'m');push(0,0,1,'m')});
 const addr=0x48;
 group('Address + W',`The master sends the 7-bit device address 0x48 (1001000) followed by the R/W bit. 0 = write. Bits go out MSB first; SDA only changes while SCL is low and is read while SCL is high.`,()=>bitsOut([...byte(addr<<1|0)],'m'));
 group('ACK','ACK: the addressed device pulls SDA LOW during the 9th clock to say "I am here". If nobody answers, SDA stays high (NACK) and the master knows the address is wrong or the device is missing.',()=>ack(false));
 group('Register 0x01','The master sends the register number 0x01 (the device\'s internal pointer).',()=>bitsOut(byte(1),'m'));
 group('ACK','The device acknowledges the register byte.',()=>ack(false));
 if(kind==='w'){
  group('Data 0x5A','The master sends the data byte 0x5A, which the device stores in register 0x01.',()=>bitsOut(byte(0x5a),'m'));
  group('ACK','The device acknowledges the data byte.',()=>ack(false));
 }else{
  group('Repeated START','REPEATED START: instead of STOP, the master issues another START. The bus stays owned by the master, so no other master can sneak in between "set pointer" and "read".',()=>{push(1,0,1,'m');push(1,1,1,'m');push(0,1,2,'m');push(0,0,1,'m')});
  group('Address + R','Same address, but now the R/W bit is 1 = read.',()=>bitsOut([...byte(addr<<1|1)],'m'));
  group('ACK','The device acknowledges its address.',()=>ack(false));
  group('Data 0x5A','Now the DEVICE drives SDA and sends the register value 0x5A. The master only produces the clock.',()=>bitsOut(byte(0x5a),'s'));
  group('NACK','The master answers NACK (leaves SDA high) after the last byte: this tells the device "no more data".',()=>{push(1,0,1,'m');push(1,1,2,'m');push(1,0,1,'m')});
 }
 group('STOP','STOP: the master releases SDA so it rises while SCL is HIGH. The bus is free again.',()=>{push(0,0,1,'m');push(0,1,2,'m');push(1,1,2,'m')});
 return{st,groups,end:t}}
function draw(i){const g=tl.groups[i],W=960,x0=90,sc=(W-x0-10)/tl.end,X=t=>x0+t*sc;const svg=$('#svg');svg.innerHTML='';
 const yS=70,yD=170,H=-18,L=18;
 for(const[n,y]of[['SCL',yS],['SDA',yD]]){const t=el('text',{x:10,y:y+5,'font-size':15,'font-weight':700,fill:'var(--fg)'},svg);t.textContent=n}
 el('rect',{x:X(g.a),y:20,width:(g.b-g.a)*sc,height:200,fill:'var(--accent-soft)',opacity:.9},svg);
 const path=(key)=>{let d='';tl.st.forEach((s,k)=>{const y=(key==='scl'?yS:yD)+(s[key]?H:L);d+=(k?` L${X(s.t0)} ${y}`:`M${X(s.t0)} ${y}`)+` L${X(s.t1)} ${y}`});return d};
 el('path',{d:path('scl'),fill:'none',stroke:'var(--accent)','stroke-width':2.5},svg);
 el('path',{d:path('sda'),fill:'none',stroke:'var(--ok)','stroke-width':2.5},svg);
 // owner bars under SDA
 tl.st.forEach(s=>{el('rect',{x:X(s.t0),y:yD+30,width:(s.t1-s.t0)*sc,height:6,fill:s.own==='s'?'var(--rom)':'var(--ok)',opacity:.8},svg)});
 const l=el('text',{x:x0,y:232,'font-size':12,fill:'var(--muted)'},svg);l.textContent='bar under SDA: green = master drives the line, orange = the addressed device drives it';
 tl.groups.forEach((q,k)=>{if(q.b-q.a<2||q.label==='Idle')return;const t=el('text',{x:X((q.a+q.b)/2),y:48,'text-anchor':'middle','font-size':12,fill:k===i?'var(--accent)':'var(--muted)','font-weight':k===i?700:400},svg);t.textContent=q.label});
 $('#narr').textContent=g.say.replace(/\\'/g,"'");$('#count').textContent=`Step ${i+1} of ${tl.groups.length}: ${g.label}`}
function start(){tl=make($('#kind').value);P=player({count:tl.groups.length,prev:$('#prev'),next:$('#next'),play:$('#play'),reset:$('#reset'),render:draw,delay:2400})}
$('#kind').onchange=()=>{if(P)P.stop();start()};start();

</script></body></html>
