<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circular DMA</title>
<style>:root{color-scheme:light;--bg:#fff;--soft:#f6f7f9;--sunk:#eef0f3;--fg:#1c2330;--muted:#5f6b7a;--line:#dde1e7;--accent:#2563eb;--accent-soft:#e8efff;--on-accent:#fff;
--rom:#b45309;--romf:#fef3c7;--flash:#6d28d9;--flashf:#ede9fe;--ram:#15803d;--ramf:#d1fae5;--bus:#0e7490;--busf:#cffafe;--bad:#c62828;--badf:#fde8e8;--ok:#15803d;--okf:#dcfce7;--warn:#b45309;--warnf:#fef9c3;--r:10px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f141b;--soft:#161c25;--sunk:#1d2531;--fg:#e4e8ee;--muted:#98a3b3;--line:#2a3441;--accent:#6ea0ff;--accent-soft:#1b2a45;--on-accent:#0b1220;--rom:#fbbf24;--romf:#3a2d0e;--flash:#a78bfa;--flashf:#2a2150;--ram:#4ade80;--ramf:#0f3328;--bus:#22d3ee;--busf:#0c3a44;--bad:#f87171;--badf:#3b1818;--ok:#4ade80;--okf:#12331f;--warn:#fbbf24;--warnf:#3a3210}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
.mono,code,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
h1,h2,h3{margin:0 0 6px;line-height:1.25}h1{font-size:1.15rem}h2{font-size:1rem}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){background:var(--sunk)}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=range]{font:inherit;color:inherit}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.panel[hidden]{display:none}
.card{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.grow{flex:1}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.narr{min-height:3.4em;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.ring{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:8px 0}
.c{border:1px solid var(--line);border-radius:6px;padding:5px 0;text-align:center;font-size:.72rem;font-family:ui-monospace,monospace;background:var(--soft);min-width:0}
.c.fill{background:var(--accent-soft);border-color:var(--accent)}.c.ready{background:var(--warnf);border-color:var(--warn)}.c.proc{background:var(--okf);border-color:var(--ok)}.c.wr{outline:3px solid var(--accent)}.c.bad{background:var(--badf);border-color:var(--bad)}
.half{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.78rem;color:var(--muted);text-align:center;margin:0}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;margin:6px 0}.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

</style></head><body>
<h1>Circular DMA with half-transfer and transfer-complete interrupts</h1>
<div class="bar"><label><input type="checkbox" id="slow"> CPU is too slow (processing a half takes longer than DMA needs to fill one)</label></div>
<div class="half"><span>first half (cells 0–7)</span><span>second half (cells 8–15)</span></div>
<div class="ring" id="ring"></div>
<div class="legend"><span><i style="background:var(--accent-soft)"></i>DMA is writing here</span><span><i style="background:var(--okf)"></i>CPU is processing it</span><span><i style="background:var(--badf)"></i>overrun: DMA overwrote unprocessed data</span></div>
<div class="narr" id="narr" aria-live="polite"></div>
<div class="bar" style="margin-top:10px"><button id="prev">◀ Back</button><button id="play" class="primary">▶ Play</button><button id="next">Next ▶</button><button id="reset">↺</button><span class="muted" id="count"></span></div>
<script>const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex=(n,w=8)=>'0x'+(n>>>0).toString(16).toUpperCase().padStart(w,'0');
// tabs: buttons with data-tab="id" show the .panel with that id
function initTabs(start=window.__START||0){const btns=$$('.tabs button');const show=id=>{btns.forEach(b=>{const on=b.dataset.tab===id;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});$$('.panel').forEach(p=>p.hidden=p.id!==id)};btns.forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));if(btns[start])show(btns[start].dataset.tab);return show}
// player: generic step controller. steps = count; render(i) draws step i; returns controls
function player({count,render,prev,next,play,reset,delay=1800}){let i=0,timer=null;const set=n=>{i=Math.max(0,Math.min(count-1,n));render(i);if(prev)prev.disabled=i===0;if(next)next.disabled=i===count-1;};const stop=()=>{clearInterval(timer);timer=null;if(play)play.textContent='▶ Play'};const go=()=>{if(i>=count-1){stop();return}set(i+1)};
if(next)next.onclick=()=>{stop();set(i+1)};if(prev)prev.onclick=()=>{stop();set(i-1)};if(reset)reset.onclick=()=>{stop();set(0)};
if(play)play.onclick=()=>{if(timer){stop();return}if(i>=count-1)set(0);play.textContent='❚❚ Pause';timer=setInterval(go,delay)};
addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if(e.key==='ArrowRight'){stop();set(i+1)}if(e.key==='ArrowLeft'){stop();set(i-1)}});
set(0);return{set,stop,get i(){return i}}}


const SIZE=16,STEPS=49;let P;
function sim(upTo,slow){const proc=slow?12:4;const st={cells:Array(SIZE).fill(null),events:[],jobs:[],overrun:false,last:null};
 for(let i=0;i<=upTo;i++){const c=i%SIZE;
  // overrun: writing into a half that the CPU still processes
  const half=c<8?0:1;if(st.jobs.some(j=>j.half===half&&i<j.end)){st.overrun=true;st.last={i,msg:'OVERRUN: DMA overwrote data in a half the CPU was still processing. Samples are lost or corrupted.'}}
  st.cells[c]={n:i,bad:st.jobs.some(j=>j.half===half&&i<j.end)};
  if(c===7){st.jobs.push({half:0,start:i,end:i+proc});st.last={i,msg:'HALF-TRANSFER interrupt: the first half is full. The CPU starts processing cells 0–7 while DMA keeps filling the second half. No samples are lost.'}}
  if(c===15){st.jobs.push({half:1,start:i,end:i+proc});st.last={i,msg:'TRANSFER-COMPLETE interrupt: the second half is full. The CPU processes cells 8–15 while DMA, in circular mode, wraps to cell 0 and goes on without any software restart.'}}
  if(st.overrun&&!st.last.msg.startsWith('OVERRUN')){}}
 return st}
function render(i){const slow=$('#slow').checked;const st=sim(i,slow);const wr=i%SIZE;
 $('#ring').innerHTML=Array.from({length:SIZE},(_,c)=>{const cell=st.cells[c];const half=c<8?0:1;const job=st.jobs.find(j=>j.half===half&&i>=j.start&&i<j.end);
  let cls='';if(cell){const full=half===0?(i%SIZE>7||i>=SIZE||false):(i%SIZE===15||i>=SIZE);cls=cell.bad?'bad':job?'proc':(c===wr?'fill':'fill')}
  // a half is waiting if it is full and no job is processing it yet: shown only for the step of the interrupt
  return `<div class="c ${cls} ${c===wr?'wr':''}">${cell?cell.n:'·'}</div>`}).join('');
 const anyBad=sim(i,slow).overrun;
 let msg=i===0?'DMA is configured in circular mode with a 16-sample buffer: it writes one sample per request (e.g. each ADC conversion) into the next cell and wraps to the start by itself. Two interrupts are enabled: half-transfer and transfer-complete.':(st.last&&st.last.i>=i-3?st.last.msg:`DMA writes sample ${i} into cell ${wr}. The CPU is ${st.jobs.some(j=>i>=j.start&&i<j.end)?'busy processing a finished half':'free'}.`);
 $('#narr').textContent=msg;$('#narr').style.borderLeftColor=anyBad&&slow?'var(--bad)':'';$('#count').textContent=`DMA write ${i+1} of ${STEPS}`}
P=player({count:STEPS,prev:$('#prev'),next:$('#next'),play:$('#play'),reset:$('#reset'),render,delay:350});$('#slow').onchange=()=>render(P.i);

</script></body></html>
