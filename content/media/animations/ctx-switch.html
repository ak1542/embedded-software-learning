<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Context switch</title>
<style>:root{color-scheme:light;--bg:#fff;--soft:#f6f7f9;--sunk:#eef0f3;--fg:#1c2330;--muted:#5f6b7a;--line:#dde1e7;--accent:#2563eb;--accent-soft:#e8efff;--on-accent:#fff;
--rom:#b45309;--romf:#fef3c7;--flash:#6d28d9;--flashf:#ede9fe;--ram:#15803d;--ramf:#d1fae5;--bus:#0e7490;--busf:#cffafe;--bad:#c62828;--badf:#fde8e8;--ok:#15803d;--okf:#dcfce7;--warn:#b45309;--warnf:#fef9c3;--r:10px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f141b;--soft:#161c25;--sunk:#1d2531;--fg:#e4e8ee;--muted:#98a3b3;--line:#2a3441;--accent:#6ea0ff;--accent-soft:#1b2a45;--on-accent:#0b1220;--rom:#fbbf24;--romf:#3a2d0e;--flash:#a78bfa;--flashf:#2a2150;--ram:#4ade80;--ramf:#0f3328;--bus:#22d3ee;--busf:#0c3a44;--bad:#f87171;--badf:#3b1818;--ok:#4ade80;--okf:#12331f;--warn:#fbbf24;--warnf:#3a3210}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
.mono,code,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
h1,h2,h3{margin:0 0 6px;line-height:1.25}h1{font-size:1.15rem}h2{font-size:1rem}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){background:var(--sunk)}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=range]{font:inherit;color:inherit}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.panel[hidden]{display:none}
.card{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.grow{flex:1}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.narr{min-height:3.4em;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.cols{grid-template-columns:1fr}}
.col h2{font-size:.9rem;display:flex;justify-content:space-between;align-items:center;gap:6px}
.stack{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft)}
.sl{display:flex;justify-content:space-between;gap:6px;padding:2px 8px;font-size:.74rem;border-bottom:1px solid var(--line);min-height:22px}
.sl:last-child{border:0}.sl.hw{background:var(--accent-soft)}.sl.sw{background:var(--warnf)}.sl.empty{color:var(--muted);opacity:.55}
.sp{color:var(--bad);font-weight:700}
.cpu{border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--soft);text-align:center;min-height:140px}
.cpu.run{border-color:var(--ok)}.cpu.hand{border-color:var(--warn)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;margin:8px 0}.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}

</style></head><body>
<h1>Context switch on Cortex-M (PendSV)</h1>
<label class="muted"><input type="checkbox" id="fresh"> Task B has never run (its stack holds a fake frame made at task creation)</label>
<div class="cols" style="margin-top:8px"><div class="col"><h2>Task A stack <span id="spa"></span></h2><div class="stack" id="sa"></div></div>
<div class="col"><h2>CPU</h2><div class="cpu" id="cpu"></div></div>
<div class="col"><h2>Task B stack <span id="spb"></span></h2><div class="stack" id="sb"></div></div></div>
<div class="legend"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>saved by hardware on exception entry</span><span><i style="background:var(--warnf);border:1px solid var(--warn)"></i>saved by the PendSV handler (software)</span></div>
<div class="narr" id="narr" aria-live="polite"></div>
<div class="bar" style="margin-top:10px"><button id="prev">◀ Back</button><button id="play" class="primary">▶ Play</button><button id="next">Next ▶</button><button id="reset">↺</button><span class="muted" id="count"></span></div>
<script>const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex=(n,w=8)=>'0x'+(n>>>0).toString(16).toUpperCase().padStart(w,'0');
// tabs: buttons with data-tab="id" show the .panel with that id
function initTabs(start=window.__START||0){const btns=$$('.tabs button');const show=id=>{btns.forEach(b=>{const on=b.dataset.tab===id;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});$$('.panel').forEach(p=>p.hidden=p.id!==id)};btns.forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));if(btns[start])show(btns[start].dataset.tab);return show}
// player: generic step controller. steps = count; render(i) draws step i; returns controls
function player({count,render,prev,next,play,reset,delay=1800}){let i=0,timer=null;const set=n=>{i=Math.max(0,Math.min(count-1,n));render(i);if(prev)prev.disabled=i===0;if(next)next.disabled=i===count-1;};const stop=()=>{clearInterval(timer);timer=null;if(play)play.textContent='▶ Play'};const go=()=>{if(i>=count-1){stop();return}set(i+1)};
if(next)next.onclick=()=>{stop();set(i+1)};if(prev)prev.onclick=()=>{stop();set(i-1)};if(reset)reset.onclick=()=>{stop();set(0)};
if(play)play.onclick=()=>{if(timer){stop();return}if(i>=count-1)set(0);play.textContent='❚❚ Pause';timer=setInterval(go,delay)};
addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if(e.key==='ArrowRight'){stop();set(i+1)}if(e.key==='ArrowLeft'){stop();set(i-1)}});
set(0);return{set,stop,get i(){return i}}}


const HW=['xPSR','PC','LR','R12','R3','R2','R1','R0'],SW=['R11','R10','R9','R8','R7','R6','R5','R4'];
// slot order top (high address) -> bottom. Stack grows down, so the first pushed item is at the top.
const SLOTS=[...HW.map(n=>({n,k:'hw'})),...SW.map(n=>({n,k:'sw'}))];
// per step: aSaved/bSaved = how many slots are filled (from the top), who = cpu state, psp = which stack PSP points to
const STEPS=[
 {aS:0,bS:16,cpu:'run',who:'Task A',psp:'a',say:'Task A is running. Its registers live in the CPU; PSP points at A\'s stack. Task B was switched out earlier: its whole context sits on its own stack.'},
 {aS:0,bS:16,cpu:'run',who:'Task A',psp:'a',say:'SysTick fires every 1 ms. When A\'s time slice is used up, the handler sets the PendSV pending bit. PendSV has the lowest priority, so it waits until all other interrupts are done.'},
 {aS:8,bS:16,cpu:'hand',who:'PendSV (handler)',psp:'a',say:'PendSV is taken. The CORE automatically pushes xPSR, PC, LR, R12, R3, R2, R1, R0 onto the stack that was in use (A\'s, via PSP). It then runs the handler on the main stack (MSP).'},
 {aS:16,bS:16,cpu:'hand',who:'PendSV (handler)',psp:'a',say:'The handler does the rest in software: MRS r0, PSP; STMDB r0!, {r4-r11}. R4–R11 are pushed below the hardware frame. Then it saves the new stack pointer in A\'s control block (tcb->sp).'},
 {aS:16,bS:16,cpu:'hand',who:'PendSV (scheduler)',psp:'b',say:'The scheduler (round robin) picks Task B. The handler loads B\'s saved stack pointer from its control block. PSP now points to B\'s stack.'},
 {aS:16,bS:8,cpu:'hand',who:'PendSV (handler)',psp:'b',say:'Software restores B\'s R4–R11: LDMIA r0!, {r4-r11}; MSR PSP, r0.'},
 {aS:16,bS:0,cpu:'run',who:'Task B',psp:'b',say:'BX LR with EXC_RETURN = 0xFFFFFFFD (return to thread mode, use PSP). The CORE pops xPSR, PC, LR, R12, R3–R0 from B\'s stack. PC now holds B\'s saved address, so B continues exactly where it stopped.'}
];
let fresh=false;
function stack(el,saved,sp,label){el.innerHTML=SLOTS.map((s,i)=>{const on=i<saved;const txt=on&&label==='B'&&fresh&&s.k==='hw'?({xPSR:'xPSR = 0x01000000 (fake)',PC:'PC = task entry (fake)',LR:'LR = task_exit'}[s.n]||s.n+' = 0'):on?s.n:'—';
 return `<div class="sl ${on?s.k:'empty'}"><span>${txt}</span><span>${i===saved&&saved<16?'':''}</span></div>`}).join('')}
function render(i){const s=STEPS[i];stack($('#sa'),s.aS,s.psp==='a','A');stack($('#sb'),s.bS,s.psp==='b','B');
 $('#spa').innerHTML=s.psp==='a'?'<span class="sp">◀ PSP</span>':'';$('#spb').innerHTML=s.psp==='b'?'<span class="sp">◀ PSP</span>':'';
 const cpu=$('#cpu');cpu.className='cpu '+s.cpu;cpu.innerHTML=`<b>${s.who}</b><br><span class="muted">${s.cpu==='run'?'running in thread mode':'handler mode (PendSV), main stack MSP'}</span><br><br><span class="mono">${s.cpu==='hand'?'R4–R11 ← being saved/restored':'R0–R12, LR, PC belong to '+s.who}</span>`;
 let t=s.say;if(fresh&&i===6)t='Same return, but B has never run: the frame was built by hand when B was created (xPSR with the Thumb bit set, PC = B\'s entry function, R0 = its argument). The core cannot tell the difference, so B starts at its first instruction.';
 $('#narr').textContent=t;$('#count').textContent=`Step ${i+1} of ${STEPS.length}`}
$('#fresh').onchange=e=>{fresh=e.target.checked;render(P.i)};
const P=player({count:STEPS.length,prev:$('#prev'),next:$('#next'),play:$('#play'),reset:$('#reset'),render,delay:2600});

</script></body></html>
