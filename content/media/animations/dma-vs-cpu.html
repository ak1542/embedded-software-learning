<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPU vs DMA</title>
<style>:root{color-scheme:light;--bg:#fff;--soft:#f6f7f9;--sunk:#eef0f3;--fg:#1c2330;--muted:#5f6b7a;--line:#dde1e7;--accent:#2563eb;--accent-soft:#e8efff;--on-accent:#fff;
--rom:#b45309;--romf:#fef3c7;--flash:#6d28d9;--flashf:#ede9fe;--ram:#15803d;--ramf:#d1fae5;--bus:#0e7490;--busf:#cffafe;--bad:#c62828;--badf:#fde8e8;--ok:#15803d;--okf:#dcfce7;--warn:#b45309;--warnf:#fef9c3;--r:10px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f141b;--soft:#161c25;--sunk:#1d2531;--fg:#e4e8ee;--muted:#98a3b3;--line:#2a3441;--accent:#6ea0ff;--accent-soft:#1b2a45;--on-accent:#0b1220;--rom:#fbbf24;--romf:#3a2d0e;--flash:#a78bfa;--flashf:#2a2150;--ram:#4ade80;--ramf:#0f3328;--bus:#22d3ee;--busf:#0c3a44;--bad:#f87171;--badf:#3b1818;--ok:#4ade80;--okf:#12331f;--warn:#fbbf24;--warnf:#3a3210}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
.mono,code,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
h1,h2,h3{margin:0 0 6px;line-height:1.25}h1{font-size:1.15rem}h2{font-size:1rem}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){background:var(--sunk)}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=range]{font:inherit;color:inherit}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.panel[hidden]{display:none}
.card{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.grow{flex:1}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.narr{min-height:3.4em;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.lane{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;margin:6px 0}
.track{position:relative;height:34px;background:var(--soft);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg{position:absolute;top:3px;bottom:3px;border-radius:5px;font-size:.72rem;display:flex;align-items:center;justify-content:center;color:var(--on-accent);overflow:hidden;opacity:0;transition:opacity .2s}
.seg.vis{opacity:1}.cpu{background:var(--bad)}.free{background:var(--ram)}.dma{background:var(--accent)}.set{background:var(--rom)}
.cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.6}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}

</style></head><body>
<h1>Copying a buffer: CPU loop vs DMA</h1>
<div class="bar"><label>Words to copy <input id="n" type="range" min="100" max="2000" step="100" value="1000"> <b id="nv">1000</b></label><span class="muted">illustrative cycle counts: CPU copy = 4 cycles per word, DMA = 1 cycle per word, setup + interrupt = 100 cycles</span></div>
<div id="lanes" style="margin-top:8px"></div>
<div class="bar" style="margin-top:6px"><button id="play" class="primary">▶ Play</button><input id="scrub" type="range" min="0" value="0" aria-label="Time" style="flex:1"></div>
<div class="stat" id="stat"></div>
<div class="narr" id="narr" aria-live="polite"></div>
<script>const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex=(n,w=8)=>'0x'+(n>>>0).toString(16).toUpperCase().padStart(w,'0');
// tabs: buttons with data-tab="id" show the .panel with that id
function initTabs(start=window.__START||0){const btns=$$('.tabs button');const show=id=>{btns.forEach(b=>{const on=b.dataset.tab===id;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});$$('.panel').forEach(p=>p.hidden=p.id!==id)};btns.forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));if(btns[start])show(btns[start].dataset.tab);return show}
// player: generic step controller. steps = count; render(i) draws step i; returns controls
function player({count,render,prev,next,play,reset,delay=1800}){let i=0,timer=null;const set=n=>{i=Math.max(0,Math.min(count-1,n));render(i);if(prev)prev.disabled=i===0;if(next)next.disabled=i===count-1;};const stop=()=>{clearInterval(timer);timer=null;if(play)play.textContent='▶ Play'};const go=()=>{if(i>=count-1){stop();return}set(i+1)};
if(next)next.onclick=()=>{stop();set(i+1)};if(prev)prev.onclick=()=>{stop();set(i-1)};if(reset)reset.onclick=()=>{stop();set(0)};
if(play)play.onclick=()=>{if(timer){stop();return}if(i>=count-1)set(0);play.textContent='❚❚ Pause';timer=setInterval(go,delay)};
addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if(e.key==='ArrowRight'){stop();set(i+1)}if(e.key==='ArrowLeft'){stop();set(i-1)}});
set(0);return{set,stop,get i(){return i}}}


const CPU_PER=4,DMA_PER=1,SETUP=100;let T,seg;
function build(){const n=+$('#n').value;$('#nv').textContent=n;
 const cpuCopy=n*CPU_PER,dmaCopy=n*DMA_PER;T=Math.max(cpuCopy,SETUP+dmaCopy)+n*0+400;
 // timeline A: CPU copies, then does other work. timeline B: setup, DMA copies while CPU does other work.
 seg={cpu:[{f:0,t:cpuCopy,c:'cpu',l:'CPU copies'},{f:cpuCopy,t:T,c:'free',l:'other work'}],
  dmaCpu:[{f:0,t:SETUP/2,c:'set',l:'set'},{f:SETUP/2,t:T,c:'free',l:'CPU does other work'}],
  dmaDma:[{f:SETUP/2,t:SETUP/2+dmaCopy,c:'dma',l:'DMA copies'}]};
 const pc=v=>v/T*100;
 const lane=(name,list)=>`<div class="lane"><b>${name}</b><div class="track">${list.map(s=>`<div class="seg ${s.c}" data-f="${s.f}" style="left:${pc(s.f)}%;width:${pc(s.t-s.f)}%">${s.l}</div>`).join('')}<div class="cursor"></div></div></div>`;
 $('#lanes').innerHTML='<p class="muted" style="margin:6px 0 0">Option A: the CPU copies in a loop</p>'+lane('CPU',seg.cpu)+'<p class="muted" style="margin:10px 0 0">Option B: the CPU programs DMA and carries on</p>'+lane('CPU',seg.dmaCpu)+lane('DMA',seg.dmaDma);
 const sc=$('#scrub');sc.max=T;sc.value=0;
 $('#stat').innerHTML=`<span class="chip">CPU busy copying: A = ${cpuCopy} cycles, B = ${SETUP} cycles (setup + interrupt)</span><span class="chip">CPU time won back with DMA: ${cpuCopy-SETUP} cycles (${Math.round((cpuCopy-SETUP)/cpuCopy*100)}%)</span>`;draw(0)}
function draw(v){const pc=x=>x/T*100;$$('.seg').forEach(s=>s.classList.toggle('vis',v>=+s.dataset.f));$$('.cursor').forEach(c=>c.style.left=pc(v)+'%');
 const n=+$('#n').value;$('#narr').textContent=v<SETUP/2?'DMA needs a short setup: source address, destination address, count, direction. Then it runs on its own.':v<n*CPU_PER?'Top: the CPU is stuck in the copy loop (load, store, increment, compare for every word). Bottom: DMA moves the words in the background and the CPU is free.':'The copy is finished in both cases. With DMA the CPU already did useful work during the transfer and gets one completion interrupt.'}
let timer=null;$('#n').oninput=()=>{clearInterval(timer);timer=null;$('#play').textContent='▶ Play';build()};$('#scrub').oninput=()=>draw(+$('#scrub').value);
$('#play').onclick=function(){if(timer){clearInterval(timer);timer=null;this.textContent='▶ Play';return}const s=$('#scrub');if(+s.value>=+s.max)s.value=0;this.textContent='❚❚ Pause';timer=setInterval(()=>{s.value=Math.min(+s.max,+s.value+(reduce?200:Math.ceil(T/150)));draw(+s.value);if(+s.value>=+s.max){clearInterval(timer);timer=null;$('#play').textContent='▶ Play'}},40)};
build();

</script></body></html>
