<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VMA, LMA and where sections live</title>
<style>
:root{color-scheme:light;--bg:#fff;--soft:#f6f7f9;--sunk:#eef0f3;--fg:#1c2330;--muted:#5f6b7a;--line:#dde1e7;--accent:#2563eb;--accent-soft:#e8efff;--on-accent:#fff;
--rom:#b45309;--romf:#fef3c7;--flash:#6d28d9;--flashf:#ede9fe;--ram:#15803d;--ramf:#d1fae5;--bus:#0e7490;--busf:#cffafe;--bad:#c62828;--badf:#fde8e8;--ok:#15803d;--okf:#dcfce7;--warn:#b45309;--warnf:#fef9c3;--r:10px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f141b;--soft:#161c25;--sunk:#1d2531;--fg:#e4e8ee;--muted:#98a3b3;--line:#2a3441;--accent:#6ea0ff;--accent-soft:#1b2a45;--on-accent:#0b1220;--rom:#fbbf24;--romf:#3a2d0e;--flash:#a78bfa;--flashf:#2a2150;--ram:#4ade80;--ramf:#0f3328;--bus:#22d3ee;--busf:#0c3a44;--bad:#f87171;--badf:#3b1818;--ok:#4ade80;--okf:#12331f;--warn:#fbbf24;--warnf:#3a3210}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
.mono,code,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
h1,h2,h3{margin:0 0 6px;line-height:1.25}h1{font-size:1.15rem}h2{font-size:1rem}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){background:var(--sunk)}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=range]{font:inherit;color:inherit}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.panel[hidden]{display:none}
.card{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.grow{flex:1}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.narr{min-height:3.4em;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media(max-width:720px){.wrap{grid-template-columns:1fr}}
.secs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.secs button{font-family:ui-monospace,Menlo,Consolas,monospace}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.92rem}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.chip.fl{background:var(--flashf);border-color:var(--flash)}.chip.ra{background:var(--ramf);border-color:var(--ram)}.chip.no{background:var(--badf);border-color:var(--bad)}
.mem{display:grid;grid-template-columns:1fr 70px 1fr;gap:6px;align-items:stretch}
.col h3{text-align:center}.mbar{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg{display:grid;place-items:center;text-align:center;font:12px ui-monospace,Menlo,Consolas,monospace;padding:3px;border-bottom:1px solid var(--line);transition:background .3s,opacity .3s,box-shadow .3s;opacity:.45;position:relative}
.seg:last-child{border-bottom:0}.seg.fl{background:var(--flashf)}.seg.ra{background:var(--ramf)}.seg.fr{background:repeating-linear-gradient(45deg,var(--sunk),var(--sunk) 6px,var(--bg) 6px,var(--bg) 12px)}
.seg.on{opacity:1;box-shadow:inset 0 0 0 3px var(--accent)}
.mid{display:grid;place-items:center;text-align:center;font-size:.72rem;color:var(--flash)}
.arrow{font-size:1.6rem;opacity:0;transition:opacity .3s}.arrow.on{opacity:1;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.q{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.opts button.ok{background:var(--okf);border-color:var(--ok)}.opts button.bad{background:var(--badf);border-color:var(--bad)}
</style></head>
<body>
<h1>VMA vs LMA: where does each section live?</h1>
<p class="muted" style="margin:0 0 6px">On a bare-metal Cortex-M without an MMU: <b>VMA ≈ runtime CPU address ≈ physical address</b>. Pick a section.</p>
<div class="secs" id="secs"></div>
<div class="wrap">
  <div class="card"><dl class="facts" id="facts"></dl><div class="narr" id="why" style="margin-top:10px" aria-live="polite"></div></div>
  <div>
    <div class="mem">
      <div class="col"><h3>Flash</h3><div class="mbar" id="flash"></div></div>
      <div class="mid"><div class="arrow" id="arrow">➜</div><div id="midTxt"></div></div>
      <div class="col"><h3>RAM</h3><div class="mbar" id="ram"></div></div>
    </div>
  </div>
</div>
<div class="q card"><h2>Quick check</h2><div id="q"></div><div class="bar" style="margin-top:6px"><button id="nq">Next question ▶</button><span class="muted" id="score"></span></div></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex=(n,w=8)=>'0x'+(n>>>0).toString(16).toUpperCase().padStart(w,'0');
// tabs: buttons with data-tab="id" show the .panel with that id
function initTabs(start=window.__START||0){const btns=$$('.tabs button');const show=id=>{btns.forEach(b=>{const on=b.dataset.tab===id;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});$$('.panel').forEach(p=>p.hidden=p.id!==id)};btns.forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));if(btns[start])show(btns[start].dataset.tab);return show}
// player: generic step controller. steps = count; render(i) draws step i; returns controls
function player({count,render,prev,next,play,reset,delay=1800}){let i=0,timer=null;const set=n=>{i=Math.max(0,Math.min(count-1,n));render(i);if(prev)prev.disabled=i===0;if(next)next.disabled=i===count-1;};const stop=()=>{clearInterval(timer);timer=null;if(play)play.textContent='▶ Play'};const go=()=>{if(i>=count-1){stop();return}set(i+1)};
if(next)next.onclick=()=>{stop();set(i+1)};if(prev)prev.onclick=()=>{stop();set(i-1)};if(reset)reset.onclick=()=>{stop();set(0)};
if(play)play.onclick=()=>{if(timer){stop();return}if(i>=count-1)set(0);play.textContent='❚❚ Pause';timer=setInterval(go,delay)};
addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if(e.key==='ArrowRight'){stop();set(i+1)}if(e.key==='ArrowLeft'){stop();set(i-1)}});
set(0);return{set,stop,get i(){return i}}}

const S={
 '.isr_vector':{vma:'Flash',lma:'Flash',bin:true,init:'nothing: it is already in place',ex:'initial SP, Reset_Handler and the other handler addresses',why:'The core reads the vector table straight from Flash at reset (or from VTOR). VMA = LMA, so nothing is copied.',f:['isr'],r:[]},
 '.text':{vma:'Flash',lma:'Flash',bin:true,init:'nothing (executed in place)',ex:'the machine code of your functions',why:'Code runs directly from Flash (execute in place). Runtime address and load address are the same.',f:['text'],r:[]},
 '.rodata':{vma:'Flash',lma:'Flash',bin:true,init:'nothing',ex:'const tables, string literals',why:'Read-only data needs no runtime writes, so non-volatile Flash is the right place.',f:['rodata'],r:[]},
 '.data':{vma:'RAM',lma:'Flash',bin:true,init:'Reset_Handler copies _sidata → _sdata … _edata',ex:'int x = 10;',why:'Two addresses: the initial values must persist in Flash (LMA), but the variables must live in writable RAM (VMA). Startup code copies Flash → RAM before main().',f:['dataimg'],r:['data'],copy:true},
 '.bss':{vma:'RAM',lma:'none',bin:false,init:'Reset_Handler zeroes _sbss … _ebss',ex:'int counter;  static char buf[256];',why:'It only needs to be zero in RAM; storing zeros in Flash would waste space, so there is no load image (NOLOAD).',f:[],r:['bss'],zero:true}
};
const FL=[['isr','.isr_vector',30,'fl'],['text','.text',70,'fl'],['rodata','.rodata',36,'fl'],['dataimg','.data image (LMA)',36,'fl'],['fr','unused',34,'fr']];
const RA=[['data','.data (VMA)',54,'ra'],['bss','.bss (VMA)',54,'ra'],['fr','free RAM / stack',112,'fr']];
const seg=([id,l,h,c])=>`<div class="seg ${c}" data-s="${id}" style="height:${h}px"><span>${l}</span></div>`;
$('#flash').innerHTML=FL.map(seg).join('');$('#ram').innerHTML=RA.map(seg).join('');
$('#secs').innerHTML=Object.keys(S).map(k=>`<button data-k="${k}">${k}</button>`).join('');
function pick(k){const s=S[k];$$('#secs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 const chip=(v)=>`<span class="chip ${v==='Flash'?'fl':v==='RAM'?'ra':'no'}">${v==='none'?'none (no load image)':v}</span>`;
 $('#facts').innerHTML=`<dt>VMA (runtime)</dt><dd>${chip(s.vma)}</dd><dt>LMA (load)</dt><dd>${chip(s.lma)}</dd><dt>Bytes in firmware.bin?</dt><dd>${s.bin?'yes':'<b>no</b>'}</dd><dt>Initialised by</dt><dd>${esc(s.init)}</dd><dt>Example</dt><dd><code>${esc(s.ex)}</code></dd>`;
 $('#why').textContent=s.why;
 $$('#flash .seg').forEach(e=>e.classList.toggle('on',s.f.includes(e.dataset.s)||(k!=='.data'&&false)));
 // for sections executed/stored in flash both VMA and LMA are the flash segment
 if(['.isr_vector','.text','.rodata'].includes(k))$$('#flash .seg').forEach(e=>e.classList.toggle('on',s.f.includes(e.dataset.s)));
 $$('#ram .seg').forEach(e=>e.classList.toggle('on',s.r.includes(e.dataset.s)));
 $('#arrow').classList.toggle('on',!!s.copy);$('#midTxt').textContent=s.copy?'copy at startup':s.zero?'zero-fill at startup':'';
}
$$('#secs button').forEach(b=>b.onclick=()=>pick(b.dataset.k));pick('.data');
const QS=[
 {q:'Which section has a VMA that differs from its LMA?',o:['.text','.data','.bss','.rodata'],a:1,e:'.data: it runs in RAM but its initial values are stored in Flash.'},
 {q:'Where does int x = 10; live while the program runs?',o:['.bss in RAM','.rodata in Flash','.data in RAM (initial value stored in Flash)','.text in Flash'],a:2,e:'It is an initialised, writable variable: .data. Runtime copy in RAM, initial value in the Flash image.'},
 {q:'Why is .bss not stored in the Flash image?',o:['It is executable','It only needs to be zero in RAM, so there is nothing worth storing','The linker forgets it','It is read-only'],a:1,e:'Zeros need not be stored; startup code clears the range _sbss … _ebss.'},
 {q:'Inside .data > RAM AT > FLASH, what does "." give?',o:['The Flash (LMA) address','The RAM (VMA) address','Always address 0','The stack pointer'],a:1,e:'"." is the location counter: the VMA, i.e. RAM here. Use LOADADDR(.data) for the Flash (LMA) address.'}
];
let qi=0,right=0,answered=false;
function showQ(){const x=QS[qi];answered=false;$('#q').innerHTML=`<div><b>${qi+1}/${QS.length}.</b> ${esc(x.q)}</div><div class="opts">${x.o.map((o,i)=>`<button data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="muted" id="fb"></div>`;
 $$('#q .opts button').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const ok=+b.dataset.i===x.a;if(ok)right++;b.classList.add(ok?'ok':'bad');$$('#q .opts button')[x.a].classList.add('ok');$('#fb').textContent=(ok?'Correct. ':'Not quite. ')+x.e;$('#score').textContent=`Score ${right}/${qi+1}`})}
$('#nq').onclick=()=>{qi=(qi+1)%QS.length;if(qi===0)right=0,$('#score').textContent='';showQ()};showQ();
</script></body></html>
